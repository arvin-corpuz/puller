# Example only -- do not commit real secrets. Create these with:
#   kubectl create secret generic puller-dockerhub-creds \
#     --from-literal=password='...'
#   kubectl create secret generic puller-ghcr-creds \
#     --from-literal=pat='...'
#
# File-mounted Secret volumes (as used in deployment.yaml) pick up rotated
# values in place, without a pod restart -- unlike env-var injection.
apiVersion: v1
kind: Secret
metadata:
  name: puller-dockerhub-creds
  namespace: default
type: Opaque
stringData:
  password: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: puller-ghcr-creds
  namespace: default
type: Opaque
stringData:
  pat: "CHANGE_ME"
